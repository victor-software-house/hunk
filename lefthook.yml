pre-commit:
  skip:
    - run: test -n "$CI"
  commands:
    format:
      glob: "{,**/}*.{ts,tsx,js,jsx,mjs,json,jsonc,md,yml,yaml,toml}"
      run: mise run format:staged -- {staged_files}
      stage_fixed: true
    lint:
      run: mise run lint
    typecheck:
      run: mise run typecheck

commit-msg:
  skip:
    - run: test -n "$CI"
  commands:
    commitlint:
      run: mise run commitlint -- {1}

pre-push:
  skip:
    - run: test -n "$CI"
  commands:
    lockfile-sync:
      run: mise run --no-deps lockfile:sync
    format:
      run: mise run format:check
    lint:
      run: mise run lint
    typecheck:
      run: mise run typecheck
